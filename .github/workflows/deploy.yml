name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: 0.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Zola
        run: |
          curl -sLJO "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "${HOME}/.local/zola"
          tar -C "${HOME}/.local/zola" -xf "zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          rm "zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HOME}/.local/zola" >> "${GITHUB_PATH}"
      - name: Verify installation
        run: zola --version
      # No --base-url: configure-pages reports this custom domain over http, which
      # leaves the icon macro's inline `url('http://…')` as mixed content once the
      # page is served over https. zola.toml's own base_url is the https one.
      - name: Build the site
        run: zola build
      - name: Strip unused CSS
        run: |
          npx --yes purgecss \
            --css public/main.css public/giallo-light.css public/giallo-dark.css \
            --content 'public/**/*.html' \
            --output public/ \
            --safelist search-empty mermaid math-block math-inline
      # The custom domain is derived from base_url so it lives in exactly one
      # place. It is written here rather than kept in static/ because Zola
      # serves a theme's static/ to every site that installs it: a CNAME there
      # follows the theme into other people's builds and points them at this
      # domain. A base_url on github.io is the default Pages domain and needs
      # no CNAME, so forks deploy unchanged.
      - name: Write custom domain
        run: |
          url=$(sed -n 's/^[[:space:]]*base_url[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' zola.toml | head -n1)
          host=${url#*://}
          host=${host%%/*}
          case "$host" in
            ""|*.github.io) echo "No custom domain in base_url ('$url') - skipping CNAME" ;;
            *)              echo "$host" > public/CNAME && echo "CNAME -> $host" ;;
          esac
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
