# The URL the site will be built for
base_url = "https://zola-yolk.gauthamchettiar.com"
title = "zola-yolk"
description = "A minimal monospace Zola theme with dark/light mode, search, Font Awesome icons, and a component-based template architecture."
compile_sass = true
build_search_index = true
# Emits atom.xml; the theme links to it from <head> when this is on.
generate_feeds = true
taxonomies = [{ name = "tags" }]

[markdown]
definition_list = true
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "catppuccin-latte"
dark_theme = "catppuccin-mocha"

[extra]
# Sections to include in the recent posts widget (folder names under content/).
# Defaults to all root-level sections if not set.
content_sections = ["posts"]

# Set to true to show a dark/light mode toggle button in the header
enable_theme_switcher = true

# Set to true to show a search button in the header (requires build_search_index = true)
enable_search = true

# Set to true to enable the render() shortcode's ```mermaid blocks. The
# library ships inside the theme's own static/ — see content/posts/externals.md.
enable_mermaid = true

# Set to true to enable the render() shortcode's ```math blocks. The
# library ships inside the theme's own static/ — see content/posts/externals.md.
enable_math = true

# Set to true to add a collapsible table of contents to every post. Override
# per post with `toc = false` under that post's own [extra].
enable_toc = true

# Deepest heading level shown in the table of contents (h1 = 1 .. h6 = 6).
# Override per post with `toc_max_level` under that post's own [extra].
toc_max_level = 6

# Heading ids left out of the table of contents, wherever they occur.
# Override per post with `toc_exclude` under that post's own [extra].
toc_exclude = []

# Footer text (plain text or HTML).
footer = "Made with ❤️ for [zola](https://www.getzola.org/)"

insert_anchor_links = true

# Self-hosted fonts to load. Each entry needs a source (subfolder under static/fonts/)
# and a name matching the synced folder under that source. `preload` is optional:
# list the subset files the site renders text with and they are fetched alongside
# the font stylesheet instead of two requests deep behind it. Body copy is 400 and
# every heading is 700, so both earn their place; the other subsets do not.
[[extra.fonts]]
source = "google"
name = "IBM Plex Mono"
preload = ["ibm-plex-mono-400-latin.woff2", "ibm-plex-mono-700-latin.woff2"]

[[extra.main_menu]]
name = "Posts"
url = "/posts"

[[extra.main_menu]]
name = "Tags"
url = "/tags"
