# zola-yolk — example configuration.
# Copy to your site's zola.toml, fill in CHANGE ME, and copy example_content/
# to content/ (the menu links below need those sections).
# All options: themes/zola-yolk/content/posts/configuration.md

base_url = "https://example.com"   # CHANGE ME — include https://
title = "My Site"                  # CHANGE ME
description = "A short sentence about this site."   # CHANGE ME
theme = "zola-yolk"

compile_sass = true
build_search_index = true   # needed by enable_search
generate_feeds = true       # atom.xml, linked from <head>
taxonomies = [{ name = "tags" }]

[markdown]
definition_list = true
bottom_footnotes = true
# Keep off: on Zola 0.22.1 it breaks heading ids after images. Use img() instead.
lazy_async_image = false
# insert_anchor_links = "right"   # "left" | "right" | "heading"

[markdown.highlighting]
style = "class"
theme = "catppuccin-mocha"   # written to static/giallo.css

[extra]

# --- Site settings ---
content_sections = ["posts"]   # post sections; unset = every root section
series_page = "series"         # series listing section, linked from series labels
recent_limit = 10              # home page posts; 0 = all
language_direction = "ltr"     # "ltr" | "rtl"
footer = "© 2026 Your Name"    # CHANGE ME — Markdown

# --- Features ---
enable_search = true           # Search menu item; needs build_search_index
enable_mermaid = true          # ```mermaid via render()
enable_math = true             # ```math via render()

# --- Defaults a post can override (same key under the post's [extra]) ---
list = "always"                # "always" | "local" (own section + series) | "never"
toc = true
toc_state = "collapsed"        # "collapsed" | "expanded"
toc_max_level = 6              # 1 (h1) .. 6 (h6)
toc_exclude = []               # heading ids to leave out
series_label = true            # "Part X of N …" under the date
series_label_text = "Part {part} of {count} from series “{series}”"
series_nav = true              # previous / next under the post
related = true                 # true = by tag, a list of paths, or false
related_limit = 0              # 0 = all

# Per-series label text (beats series_label_text; a post's own beats both).
# [extra.series_label_texts]
# "Shortcodes" = "Chapter {part} of {count} — {series}"

# Self-hosted fonts: source = folder under static/fonts/, name = synced folder,
# preload = subset files to fetch early. Sync another font with:
#   cd themes/zola-yolk/scripts/py-ssg-tools
#   uv run pst sync fonts --name "Your Font" --dest ../../static/fonts/google --weights 400,700 --subset latin
[[extra.fonts]]
source = "google"
name = "IBM Plex Mono"
preload = ["ibm-plex-mono-400-latin.woff2", "ibm-plex-mono-700-latin.woff2"]

# Header menu (CHANGE ME). These three are the pages example_content/ provides.
[[extra.main_menu]]
name = "Posts"
url = "/posts"

[[extra.main_menu]]
name = "Series"
url = "/series"

[[extra.main_menu]]
name = "Tags"
url = "/tags"
