{#
  Wraps each task-list item in a <label> so its checkbox has an accessible name.
#}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("li > input[type=checkbox]").forEach(function (box) {
      var item = box.parentNode;
      var label = document.createElement("label");
      while (item.firstChild) label.appendChild(item.firstChild);
      item.appendChild(label);
    });
  });
</script>
