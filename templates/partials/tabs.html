{#
  Keeps tab blocks with the same `group` in step, and holds the scroll position
  while their heights change. Without JS each block still switches alone.
#}
<script>
  (function () {
    function radios(tabs) {
      return tabs.querySelectorAll(":scope > input");
    }

    // Delegated from the document so blocks rendered at any depth are covered.
    document.addEventListener("change", function (event) {
      const input = event.target;
      if (!input.matches || !input.matches('.tabs[data-group] > input')) return;

      const tabs = input.parentElement;
      const rectBefore = tabs.getBoundingClientRect();

      const index = Array.prototype.indexOf.call(radios(tabs), input);
      document.querySelectorAll(".tabs[data-group]").forEach(function (other) {
        if (other === tabs || other.dataset.group !== tabs.dataset.group) return;
        // Checking a radio in code fires no `change` event, so this cannot
        // bounce back into the handler.
        const peer = radios(other)[index];
        if (peer) peer.checked = true;
      });

      // Reading layout here forces the browser to apply the sync above before
      // measuring, so the two rects are the before/after of the whole update.
      const rectAfter = tabs.getBoundingClientRect();
      const offset = rectAfter.top - rectBefore.top;
      if (offset !== 0) window.scrollBy(0, offset);
    });
  })();
</script>
