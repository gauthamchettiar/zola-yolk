{#
  Search: markup, scripts and behaviour in one file. Included at the end of
  <body> by base.html when config.extra.enable_search is set.

  A native <dialog> supplies the backdrop, Escape-to-close, the focus trap and
  focus restoration, so none of that is reimplemented below.
#}
<dialog id="search-modal" aria-label="Search">
  <search>
    <label for="search-input">
      <span class="visually-hidden">Search</span>
      {{- widgets::icon(name="magnifying-glass") -}}
    </label>
    <input id="search-input" type="search" placeholder="Search posts…" autocomplete="off" spellcheck="false" autofocus>
    <button type="button" id="search-close" aria-label="Close search">{{ widgets::icon(name="xmark") }}</button>
  </search>
  <ul class="search-results" id="search-results" role="list"></ul>
</dialog>

<script src="{{ get_url(path="elasticlunr.min.js") }}"></script>
<script src="{{ get_url(path="search_index." ~ config.default_language ~ ".js") }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const dialog = document.getElementById("search-modal");
    const input = document.getElementById("search-input");
    const results = document.getElementById("search-results");
    if (!dialog) return;

    let index = null;

    function open() {
      input.value = "";
      results.replaceChildren();
      dialog.showModal();
    }

    const toggle = document.getElementById("search-toggle");
    if (toggle) toggle.addEventListener("click", open);
    document.getElementById("search-close").addEventListener("click", function () { dialog.close(); });

    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        open();
      }
    });

    // The dialog has no padding, so a click that lands on it is a backdrop click.
    dialog.addEventListener("click", function (e) {
      if (e.target === dialog) dialog.close();
    });

    dialog.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      const links = Array.from(results.querySelectorAll("a"));
      if (!links.length) return;
      const i = links.indexOf(document.activeElement);
      if (e.key === "ArrowDown") {
        links[i === -1 || i === links.length - 1 ? 0 : i + 1].focus();
      } else if (i <= 0) {
        input.focus();
      } else {
        links[i - 1].focus();
      }
    });

    input.addEventListener("input", function () {
      const query = input.value.trim();
      results.replaceChildren();
      if (query.length < 2 || !window.searchIndex) return;

      if (!index) index = elasticlunr.Index.load(window.searchIndex);
      const hits = index.search(query, {
        fields: { title: { boost: 2 }, body: { boost: 1 } },
        expand: true
      });

      if (!hits.length) {
        const empty = document.createElement("li");
        empty.className = "search-empty";
        empty.textContent = 'No results for "' + query + '"';
        results.append(empty);
        return;
      }

      for (const hit of hits.slice(0, 8)) {
        const doc = index.documentStore.getDoc(hit.ref);
        const body = (doc.body || "").replace(/<[^>]+>/g, "");

        const link = document.createElement("a");
        link.href = hit.ref;
        link.textContent = doc.title || hit.ref;

        if (body) {
          const summary = document.createElement("p");
          summary.textContent = body.slice(0, 160) + (body.length > 160 ? "..." : "");
          link.append(summary);
        }

        const item = document.createElement("li");
        item.append(link);
        results.append(item);
      }
    });
  });
</script>
